name: Telegram Telemetry

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping."
            exit 0
          fi

          # تنسيق رسالة تنبيه واضحة
          MESSAGE="🚨 *نشاط جديد على المستودع*
          📂 *المستودع:* \`${{ github.repository }}\`
          👤 *المبرمج/المنفذ:* \`${{ github.actor }}\`
          🌿 *الفرع:* \`${{ github.ref_name }}\`
          💬 *الرسالة:* \`${{ github.event.head_commit.message || github.event.pull_request.title || 'تحديث برمجي' }}\`
          🔗 [رابط التعديل](${{ github.event.head_commit.url || github.event.pull_request.html_url || github.server_url }})"

          # إرسال الطلب مباشرة إلى API تيليجرام
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown" \
            > /dev/null
